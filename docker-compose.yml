version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: genesis-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: genesis
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
